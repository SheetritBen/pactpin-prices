name: Update prices
on:
  schedule:
    - cron: '17 13 * * *'      # daily, 13:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these services (comma-separated ids), blank = today''s set'
        required: false
permissions:
  contents: write
concurrency: { group: update-prices, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test.mjs
      - run: node scripts/update-prices.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
      - name: Commit changes
        run: |
          git config user.name "pactpin-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json pending.json last-run.md
          git diff --cached --quiet || (git commit -m "Prices: $(date -u +%F)" && git push)
